name: Atlas preview checks
on:
  push:
    branches: [preview/persistence-atlas]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - run: python3 -B -m unittest discover -s scripts -p '*_test.py'
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test against the built snapshot
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/atlas-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from 'playwright'; console.log(chromium.executablePath())")" OBSERVATORY_URL=http://127.0.0.1:4173 npm run test:atlas-browser
      - run: node scripts/pack-atlas.mjs .cache/screenshots/CIRCULA-Observatory.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CIRCULA-Observatory-preview
          path: .cache/screenshots/
